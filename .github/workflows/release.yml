# Windows installer (NSIS) + auto-update feed.
#
# * Push a tag vX.Y.Z  → build, sign the update, publish a GitHub Release with the installer and latest.json.
# * Run manually       → build only; the installer is uploaded as a workflow artifact (no release).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) — see docs/RELEASING.md.

name: Release

on:
  push:
    tags: ["v*"]
    # TEMPORARY: workflow_dispatch only works once this file is on main; build-only test runs on this branch.
    branches: [packaging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Version must match the tag
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tauri.conf.json version is $v but the tag is ${GITHUB_REF_NAME}. Run scripts/bump-version.mjs first."
            exit 1
          fi

      - name: Fetch uv.exe and ffmpeg.exe (pinned, SHA-256 checked)
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      - name: Stage engine source
        run: node scripts/stage-engine.mjs

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Updater signing
        id: signing
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Signing key present: update artifacts will be signed."
            echo "config=" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing — a release without signed updates would break auto-update."
            exit 1
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building the installer without updater artifacts."
            cfg="${RUNNER_TEMP//\\//}/unsigned.json"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$cfg"
            echo "config=--config $cfg" >> "$GITHUB_OUTPUT"
          fi

      # ---- tag: build + GitHub Release + latest.json for the updater --------------------------------------------
      - name: Build and publish release
        if: env.IS_TAG == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Holos Studio ${{ github.ref_name }}
          releaseBody: |
            Windows installer: **Holos.Studio_*_x64-setup.exe** below.

            First launch downloads Python and the speech-recognition libraries (~2.5 GB, once).
            Installed versions update themselves from this page.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # ---- manual run: build only, installer as a workflow artifact -------------------------------------------
      - name: Build installer
        if: env.IS_TAG != 'true'
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npm run tauri -- build ${{ steps.signing.outputs.config }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The end of the build log as an annotation: readable from the run summary / API without downloading logs.
      - name: Report build failure
        if: failure() && env.IS_TAG != 'true'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const f = process.env.RUNNER_TEMP + "/build.log";
            const lines = fs.existsSync(f) ? fs.readFileSync(f, "utf8").split(/\r?\n/) : ["(no build log)"];
            const tail = lines.map((l) => l.replace(/\x1b\[[0-9;]*m/g, "")).filter((l) => l.trim()).slice(-60).join("\n");
            const esc = tail.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log("::error title=Build log (tail)::" + esc);
          '

      - name: Upload installer artifact
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: holos-studio-windows-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          compression-level: 0

      # Install on the runner, let the app create its Python environment, check the engine starts and stops.
      - name: Smoke test the installer
        if: env.IS_TAG != 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/smoke-test.ps1 -Installer $setup.FullName
