# Windows installer (NSIS) + auto-update feed.
#
# * Push a tag vX.Y.Z or vX.Y.Z-beta.N → build, sign the update, smoke-test the installer, publish a GitHub Release (a beta is marked
#   Pre-release) with the text from CHANGELOG.md, and point the update feed (release "updater") at it.
# * Run manually with "publish" ticked (main only) → the same, for the version in tauri.conf.json; the workflow
#   creates the tag vX.Y.Z itself. This is the usual way to release.
# * Run manually without "publish" → build only; the installer is uploaded as a workflow artifact (no release).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) — see docs/RELEASING.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the version in tauri.conf.json (creates the tag; main only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # true = publish a release (tag push, or a manual run with "publish" ticked)
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Release tag
        id: tag
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::tauri.conf.json version is $v but the tag is ${GITHUB_REF_NAME}. Run scripts/bump-version.mjs first."
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Publish only from main (this run is on ${GITHUB_REF_NAME})."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
              echo "::error::v$v is already released. Bump the version (scripts/bump-version.mjs) for a new release."
              exit 1
            fi
          fi
          echo "name=v$v" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v from ${GITHUB_SHA}"

      - name: Release notes from CHANGELOG.md
        id: notes
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          v="${{ steps.tag.outputs.name }}"; v="${v#v}"
          node scripts/release-notes.mjs "$v" release > "$RUNNER_TEMP/body.md"
          node scripts/release-notes.mjs "$v" app > "$RUNNER_TEMP/app-notes.md"
          {
            echo "title=$(node scripts/release-notes.mjs "$v" title)"
            echo "prerelease=$([[ "$v" == *-* ]] && echo true || echo false)"
            echo "body<<HOLOS_EOF"
            cat "$RUNNER_TEMP/body.md"
            echo "HOLOS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch uv.exe and ffmpeg.exe (pinned, SHA-256 checked)
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      - name: Stage engine source
        run: node scripts/stage-engine.mjs

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Updater signing
        id: signing
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Signing key present: update artifacts will be signed."
            echo "config=" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing — a release without signed updates would break auto-update."
            exit 1
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building the installer without updater artifacts."
            cfg="${RUNNER_TEMP//\\//}/unsigned.json"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$cfg"
            echo "config=--config $cfg" >> "$GITHUB_OUTPUT"
          fi

      # ---- tag: build + GitHub Release + latest.json for the updater --------------------------------------------
      - name: Build installer
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npm run tauri -- build ${{ steps.signing.outputs.config }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The end of the build log as an annotation: readable from the run summary / API without downloading logs.
      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const f = process.env.RUNNER_TEMP + "/build.log";
            const lines = fs.existsSync(f) ? fs.readFileSync(f, "utf8").split(/\r?\n/) : ["(no build log)"];
            const tail = lines.map((l) => l.replace(/\x1b\[[0-9;]*m/g, "")).filter((l) => l.trim()).slice(-60).join("\n");
            const esc = tail.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            console.log("::error title=Build log (tail)::" + esc);
          '

      - name: Upload installer artifact
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: holos-studio-windows-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          compression-level: 0

      # Install on the runner, let the app create its Python environment, check the engine starts and stops.
      # Runs before publishing too: a release that does not start is never published.
      - name: Smoke test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          ./scripts/smoke-test.ps1 -Installer $setup.FullName

      # ---- publish: GitHub Release + update feed -------------------------------------------------------------
      - name: Publish release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          out="${RUNNER_TEMP//\\//}/release"; mkdir -p "$out"
          setup=$(ls app/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          name="Holos.Studio_${v}_x64-setup.exe"
          cp "$setup" "$out/$name"
          cp "$setup.sig" "$out/$name.sig"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${name}"
          V="$v" URL="$url" SIG="$out/$name.sig" NOTES="$RUNNER_TEMP/app-notes.md" OUT="$out/latest.json" node -e '
            const fs = require("fs");
            const e = process.env;
            const p = { signature: fs.readFileSync(e.SIG, "utf8").trim(), url: e.URL };
            const j = { version: e.V, notes: fs.readFileSync(e.NOTES, "utf8").trim(), pub_date: new Date().toISOString(),
                        platforms: { "windows-x86_64": p, "windows-x86_64-nsis": p } };
            fs.writeFileSync(e.OUT, JSON.stringify(j, null, 2));
          '
          flags=(--latest)
          [ "$PRERELEASE" = "true" ] && flags=(--prerelease --latest=false)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/body.md" "${flags[@]}" \
            "$out/$name" "$out/$name.sig" "$out/latest.json"
          echo "::notice title=Released::$TITLE — https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # The app polls releases/download/updater/latest.json (tauri.conf.json → plugins.updater). GitHub's
      # "latest release" skips pre-releases, so the feed lives in its own release and is replaced on every release.
      - name: Publish the update feed
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view updater -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updater -R "$GITHUB_REPOSITORY" --target main --prerelease --latest=false \
              --title "Update feed (technical)" \
              --notes "Used by installed copies of Holos Studio to find new versions. Downloads are on the version releases — do not delete this release."
          fi
          gh release upload updater "${RUNNER_TEMP//\\//}/release/latest.json" -R "$GITHUB_REPOSITORY" --clobber
