[package]
name = "holos-studio"
version = "0.2.0-beta.7"
description = "Holos Studio — podcast editor"
authors = ["Brain From Ukraine"]
license = "MIT"
edition = "2021"

[lib]
name = "holos_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Engine manager: hash of the bundled engine source, random per-launch API token.
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Windows only: Job Object so the engine (and the Python it starts) dies with the app.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
