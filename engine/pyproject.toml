[project]
name = "holos-engine"
version = "0.1.0"
description = "Holos Studio engine: podcast analysis, editing, voice processing and rendering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Brain From Ukraine" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "onnxruntime>=1.18",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
holos = "holos.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
