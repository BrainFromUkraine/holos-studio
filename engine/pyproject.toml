[project]
name = "holos-engine"
version = "0.2.0b1"
description = "Holos Studio engine: podcast analysis, editing, voice processing and rendering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Brain From Ukraine" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "onnxruntime>=1.18",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2"]
# Python modules used by video export templates (e.g. drawing frames with OpenCV / Pillow)
video = ["opencv-python-headless>=4.9", "pillow>=10"]
gpu = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
holos = "holos.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
